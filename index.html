<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyCast · Repaso para Examen</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f4e79">
<style>
  :root {
    --azul: #1f4e79; --violeta: #6a4c93; --fondo: #f7f9fb; --tarjeta: #ffffff;
    --texto: #222222; --borde: #cfd8dc; --gris: #f4f6f8; --verde: #2e7d32; --rojo: #b71c1c;
  }
  /* MODO OSCURO (Mantiene la estética original) */
  body.dark {
    --fondo: #121212; --tarjeta: #1e1e1e; --texto: #e0e0e0; --borde: #333333; --gris: #2d2d2d; --azul: #4db8ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 14px; font-family: system-ui, -apple-system, sans-serif; background: var(--fondo); color: var(--texto); line-height: 1.5; transition: background .3s; }
  .container { max-width: 820px; margin: 0 auto; background: var(--tarjeta); border-radius: 16px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,.08); }
  header { text-align: center; margin-bottom: 20px; position: relative; }
  h1 { margin: 0; font-size: 26px; color: var(--azul); }
  .subtitle { color: #888; font-size: 14px; margin: 4px 0 0; }
  .top-btns { position: absolute; top: 0; right: 0; display: flex; gap: 8px; }
  .icon-btn { background: var(--gris); border: none; border-radius: 50%; width: 36px; height: 36px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; color: var(--texto); }
  
  /* TEMAS */
  .topic-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(140px,1fr)); gap: 10px; margin: 16px 0; }
  .topic-btn { background: var(--gris); border: 2px solid transparent; color: var(--texto); border-radius: 12px; padding: 14px 10px; cursor: pointer; font-size: 14px; font-weight: 600; text-align: center; transition: all .2s; }
  .topic-btn.active { background: var(--azul); color: #fff; border-color: var(--azul); }
  .topic-btn .emoji { display: block; font-size: 22px; margin-bottom: 4px; }
  
  /* PESTAÑAS */
  .tabs { display: flex; gap: 6px; margin: 18px 0 12px; border-bottom: 2px solid var(--borde); flex-wrap: wrap; }
  .tab { background: none; border: none; padding: 10px 14px; cursor: pointer; font-size: 15px; font-weight: 600; color: #888; border-bottom: 3px solid transparent; margin-bottom: -2px; }
  .tab.active { color: var(--azul); border-bottom-color: var(--azul); }
  .panel { display: none; }
  .panel.active { display: block; animation: fade .3s; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  
  /* PODCAST Y FLASHCARDS */
  .podcast-player { background: linear-gradient(135deg,var(--violeta),var(--azul)); color: #fff; border-radius: 14px; padding: 20px; margin-bottom: 14px; }
  .podcast-controls { display: flex; gap: 8px; flex-wrap: wrap; }
  .podcast-controls button { background: rgba(255,255,255,.2); color: #fff; border: none; border-radius: 10px; padding: 10px 16px; font-size: 15px; cursor: pointer; font-weight: 600; }
  .script-line { background: var(--tarjeta); border-left: 4px solid var(--violeta); border-radius: 10px; padding: 10px 12px; margin: 8px 0; font-size: 14px; cursor: pointer; border: 1px solid var(--borde); }
  
  .flashcard-container { perspective: 1000px; width: 100%; height: 200px; margin: 20px 0; cursor: pointer; }
  .flashcard { width: 100%; height: 100%; position: relative; transition: transform 0.6s; transform-style: preserve-3d; }
  .flashcard.flipped { transform: rotateY(180deg); }
  .flashcard-front, .flashcard-back { position: absolute; width: 100%; height: 100%; -webkit-backface-visibility: hidden; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; border-radius: 16px; font-size: 24px; font-weight: bold; padding: 20px; text-align: center; box-shadow: 0 4px 12px rgba(0,0,0,.1); }
  .flashcard-front { background: var(--azul); color: #fff; }
  .flashcard-back { background: var(--violeta); color: #fff; transform: rotateY(180deg); }
  
  /* QUIZ Y SIMULACRO */
  .ai-generator-box { background: var(--gris); padding: 15px; border-radius: 12px; margin-bottom: 20px; text-align: center; border: 1px dashed var(--borde); }
  .ai-generator-box input { width: 100%; max-width: 400px; padding: 10px; border: 1.5px solid var(--borde); border-radius: 8px; margin-bottom: 10px; background: var(--tarjeta); color: var(--texto); }
  .question { background: var(--gris); border-radius: 12px; padding: 16px; margin: 12px 0; border: 1px solid var(--borde); }
  .options label { display: block; background: var(--tarjeta); border: 1.5px solid var(--borde); border-radius: 10px; padding: 10px 12px; margin: 6px 0; cursor: pointer; font-size: 15px; color: var(--texto); }
  .options label.correct { background: #e8f5e9; border-color: var(--verde); color: #1b5e20; }
  .options label.wrong { background: #ffebee; border-color: var(--rojo); color: #b71c1c; }
  .score { background: #fff3e0; border: 1.5px solid #ffb74d; border-radius: 12px; padding: 14px; margin-top: 14px; font-weight: bold; text-align: center; color: #e65100; }
  
  /* ================= CHAT IA ESTILO CHATGPT ================= */
  .chat-container { background: var(--tarjeta); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; height: 520px; border: 1px solid var(--borde); }
  .chat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--borde); }
  .chat-header h3 { margin: 0; font-size: 16px; color: var(--azul); }
  .clear-btn { background: none; border: 1px solid var(--rojo); color: var(--rojo); padding: 5px 10px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: bold; }
  .clear-btn:hover { background: var(--rojo); color: white; }
  
  #chatMessages { flex: 1; overflow-y: auto; margin-bottom: 15px; display: flex; flex-direction: column; gap: 20px; padding-right: 5px; scroll-behavior: smooth; }
  
  /* Mensaje del usuario */
  .msg-user { background: var(--azul); color: white; padding: 10px 16px; border-radius: 20px; align-self: flex-end; max-width: 80%; font-size: 15px; line-height: 1.5; }
  
  /* Mensaje de la IA */
  .msg-ai-wrapper { align-self: flex-start; width: 100%; max-width: 100%; }
  .msg-ai-text { font-size: 15px; line-height: 1.6; white-space: pre-wrap; margin-bottom: 8px; color: var(--texto); }
  
  .msg-actions { display: flex; gap: 12px; opacity: 0.6; }
  .msg-actions:hover { opacity: 1; }
  .action-icon { background: none; border: none; cursor: pointer; color: var(--texto); padding: 4px; border-radius: 6px; font-size: 16px; display: flex; align-items: center; }
  .action-icon:hover { background: var(--gris); }
  
  /* Input estilo ChatGPT */
  .chat-input-area { display: flex; gap: 8px; background: var(--gris); padding: 8px 12px; border-radius: 24px; border: 1px solid var(--borde); align-items: center; }
  .chat-input-area input { flex: 1; padding: 10px; border: none; font-size: 15px; background: transparent; color: var(--texto); outline: none; }
  .mic-btn { background: none; color: var(--texto); border: none; border-radius: 50%; width: 40px; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .mic-btn.listening { color: var(--rojo); animation: pulse 1s infinite; }
  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
  .send-btn { background: var(--azul); color: white; border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; }
  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  
  button.primary { background: var(--azul); color: #fff; border: none; border-radius: 10px; padding: 12px 20px; font-size: 15px; cursor: pointer; font-weight: 600; }
  button.primary:disabled { background: #b0bec5; cursor: not-allowed; }
</style>
</head>
<body class="dark">
<div class="container">
  <header>
    <div class="top-btns"><button class="icon-btn" id="themeBtn" title="Modo Oscuro">☀️</button></div>
    <h1>🎓 StudyCast</h1>
    <p class="subtitle">Tu App de Estudio para el Examen</p>
  </header>

  <div class="topic-grid" id="topicGrid"></div>

  <div class="tabs">
    <button class="tab active" data-tab="podcast">🎙️ Podcast</button>
    <button class="tab" data-tab="quiz">📝 Quiz y Simulacros</button>
    <button class="tab" data-tab="flashcards">🃏 Flashcards</button>
    <button class="tab" data-tab="ai">🤖 Tutor IA</button>
  </div>

  <!-- Podcast -->
  <div class="panel active" id="panel-podcast">
    <div class="podcast-player">
      <p id="podcastTitle" style="margin-top:0;">Elige un tema arriba</p>
      <div class="podcast-controls">
        <button id="playBtn">▶ Reproducir</button>
        <button id="stopBtn">■ Detener</button>
      </div>
      <div id="nowSpeaking" style="margin-top:12px;font-size:14px;"></div>
    </div>
    <div id="scriptContainer"></div>
  </div>

  <!-- Quiz y Simulacros -->
  <div class="panel" id="panel-quiz">
    <div class="ai-generator-box">
      <h3 style="margin-top:0; color:var(--azul);">✨ Simulacro de Examen con IA</h3>
      <p style="font-size:13px; color:#888;">Escribe cualquier tema para generar 5 preguntas nuevas.</p>
      <input type="text" id="aiTopicInput" placeholder="Ej: Phrasal Verbs, Viajes, Present Perfect...">
      <br>
      <button class="primary" id="aiGenerateBtn">Generar Simulacro</button>
      <div id="aiLoading" style="display:none; margin-top:10px;">⏳ Creando examen...</div>
    </div>

    <!-- Aquí se cargan los quizzes estáticos o el de la IA -->
    <div id="quizContainer"></div>
  </div>

  <!-- Flashcards -->
  <div class="panel" id="panel-flashcards">
    <p style="text-align:center;color:#888;">Haz clic en la tarjeta para girarla.</p>
    <p id="fcCounter" style="text-align:center; font-weight:bold; color:var(--azul);">1 / 15</p>
    <div class="flashcard-container" id="flashcardBox">
      <div class="flashcard" id="flashcard"><div class="flashcard-front" id="fcFront">Word</div><div class="flashcard-back" id="fcBack">Translation</div></div>
    </div>
    <div style="display:flex;gap:10px;justify-content:center;"><button class="primary" id="prevFc">⬅ Anterior</button><button class="primary" id="nextFc">Siguiente ➡</button></div>
  </div>

  <!-- Tutor IA (Estilo ChatGPT) -->
  <div class="panel" id="panel-ai">
    <div class="chat-container">
      <div class="chat-header">
        <h3>💬 Tutor Bilingüe</h3>
        <button class="clear-btn" id="clearChatBtn">🗑️ Borrar Chat</button>
      </div>
      <div id="chatMessages"></div>
      <div class="chat-input-area">
        <button class="mic-btn" id="micBtn" title="Hablar">🎤</button>
        <input type="text" id="chatInput" placeholder="Pregúntame cualquier cosa...">
        <button class="send-btn" id="chatBtn">↑</button>
      </div>
    </div>
  </div>
</div>

<script>
  let contextoQuiz = null; 
  let isListening = false;
  let chatHistory = JSON.parse(localStorage.getItem('studycast_history')) || [];
  let lastUserMessage = "";

  let currentTopicKey = 'present_simple'; 
  let currentUtterances = []; 
  let currentFcIndex = 0;
  let currentFlashcards = [];

  // --- MODO OSCURO ---
  const themeBtn = document.getElementById('themeBtn');
  if (localStorage.getItem('theme') !== 'dark') { document.body.classList.remove('dark'); themeBtn.textContent = '🌙'; }
  themeBtn.addEventListener('click', () => { 
    document.body.classList.toggle('dark'); 
    const isDark = document.body.classList.contains('dark'); 
    localStorage.setItem('theme', isDark ? 'dark' : 'light'); 
    themeBtn.textContent = isDark ? '☀️' : '🌙'; 
  });

  // --- DATOS DE LOS TEMAS ---
  const TOPICS = {
    present_simple: {
      name: "Present Simple", emoji: "⏰",
      podcast: [{ who: "Host", text: "Welcome." }, { who: "Teacher", text: "It is for routines. I go to school every day." }],
      questions: [
        { q: "My sister ___ to school by bus every day.", a: "goes", opts: ["go","goes","going"] }, { q: "___ she like pizza?", a: "Does", opts: ["Do","Does","Is"] }, { q: "We ___ not watch TV.", a: "do", opts: ["do","does","are"] }, { q: "He ___ football.", a: "plays", opts: ["play","plays","playing"] }, { q: "Water ___ at 100 degrees.", a: "boils", opts: ["boil","boils","boiling"] }
      ],
      flashcards: [{ front: "go", back: "ir" }, { front: "work", back: "trabajar" }, { front: "every day", back: "todos los días" }, { front: "always", back: "siempre" }, { front: "never", back: "nunca" }]
    },
    past_simple: {
      name: "Past Simple", emoji: "📅",
      podcast: [{ who: "Host", text: "Today we review the past simple." }, { who: "Teacher", text: "Go becomes went." }],
      questions: [
        { q: "I ___ to the park yesterday.", a: "went", opts: ["go","went","going"] }, { q: "She ___ TV last night.", a: "watched", opts: ["watch","watched","watching"] }, { q: "___ you see the film?", a: "Did", opts: ["Do","Did","Does"] }, { q: "We ___ not eat.", a: "did", opts: ["do","did","does"] }, { q: "They ___ pizza.", a: "ate", opts: ["eat","ate","eating"] }
      ],
      flashcards: [{ front: "went", back: "fui" }, { front: "ate", back: "comí" }, { front: "yesterday", back: "ayer" }, { front: "last night", back: "anoche" }, { front: "bought", back: "compré" }]
    },
    vocabulary: {
      name: "Vocabulary", emoji: "📚",
      podcast: [{ who: "Host", text: "Welcome back." }, { who: "Teacher", text: "Places: bank, supermarket." }],
      questions: [
        { q: "You buy medicine at the ___.", a: "pharmacy", opts: ["bank","pharmacy","library"] }, { q: "The opposite of 'hot' is ___.", a: "cold", opts: ["warm","cold","big"] }, { q: "You wear ___ on your feet.", a: "shoes", opts: ["shoes","hat","gloves"] }, { q: "A place to borrow books is a ___.", a: "library", opts: ["library","bank","supermarket"] }, { q: "The opposite of 'expensive' is ___.", a: "cheap", opts: ["rich","cheap","big"] }
      ],
      flashcards: [{ front: "Pharmacy", back: "Farmacia" }, { front: "Bank", back: "Banco" }, { front: "Supermarket", back: "Supermercado" }, { front: "Library", back: "Biblioteca" }, { front: "Ticket", back: "Boleto" }]
    }
  };

  const topicGrid = document.getElementById('topicGrid');
  Object.keys(TOPICS).forEach(function(key){
    const t = TOPICS[key]; const btn = document.createElement('button');
    btn.className = 'topic-btn'; btn.dataset.key = key;
    btn.innerHTML = '<span class="emoji">' + t.emoji + '</span>' + t.name;
    btn.addEventListener('click', function(){ selectTopic(key); });
    topicGrid.appendChild(btn);
  });

  function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [array[i], array[j]] = [array[j], array[i]]; }
    return array;
  }

  function selectTopic(key) {
    currentTopicKey = key; stopPodcast();
    document.querySelectorAll('.topic-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.key === key); });
    const t = TOPICS[key];
    document.getElementById('podcastTitle').textContent = '🎧 ' + t.name;
    renderScript(t.podcast);
    
    const shuffledQuestions = [...t.questions].map(q => { return { ...q, opts: shuffleArray([...q.opts]) }; });
    shuffleArray(shuffledQuestions); 
    
    // Al seleccionar un tema estático, limpiamos el examen de IA anterior
    document.getElementById('quizContainer').innerHTML = '<p style="text-align:center; color:#888; font-size:14px;">Haz clic en "Generar Simulacro" para un examen de IA o selecciona otro tema.</p>';
    
    currentFlashcards = shuffleArray([...t.flashcards]);
    currentFcIndex = 0; updateFlashcard(); document.getElementById('flashcard').classList.remove('flipped');
  }

  document.querySelectorAll('.tab').forEach(function(tab){
    tab.addEventListener('click', function(){
      document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
      document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('active'); });
      tab.classList.add('active'); document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
      if(tab.dataset.tab === 'ai') {
        setTimeout(() => document.getElementById('chatInput').focus(), 100);
        const container = document.getElementById('chatMessages');
        container.scrollTop = container.scrollHeight;
      }
    });
  });

  // --- PODCAST ---
  const scriptContainer = document.getElementById('scriptContainer'); const nowSpeaking = document.getElementById('nowSpeaking');
  function renderScript(lines) {
    scriptContainer.innerHTML = '';
    lines.forEach(function(line, i){
      const div = document.createElement('div'); div.className = 'script-line';
      div.innerHTML = '<span style="color:var(--violeta);font-weight:bold;font-size:12px;display:block;">' + line.who + '</span>' + line.text;
      div.onclick = () => playFrom(i); scriptContainer.appendChild(div);
    });
  }
  function playFrom(startIndex) {
    if (!('speechSynthesis' in window)) return alert('No audio.');
    stopPodcast(); const lines = TOPICS[currentTopicKey].podcast;
    for (let i = startIndex; i < lines.length; i++) {
      const u = new SpeechSynthesisUtterance(lines[i].text); u.lang = 'en-GB';
      if (lines[i].who === 'Host') { u.pitch = 1.1; } else { u.pitch = 0.85; }
      u.onstart = () => { nowSpeaking.textContent = '▶ ' + lines[i].who + ': ' + lines[i].text; };
      currentUtterances.push(u); speechSynthesis.speak(u);
    }
  }
  function stopPodcast() { if ('speechSynthesis' in window) speechSynthesis.cancel(); currentUtterances = []; nowSpeaking.textContent = ''; }
  document.getElementById('playBtn').onclick = () => playFrom(0);
  document.getElementById('stopBtn').onclick = stopPodcast;

  // --- QUIZ Y SIMULACRO IA ---
  function renderQuiz(questions, container) {
    container.innerHTML = ''; const suffix = Math.random().toString(36).slice(2);
    questions.forEach(function(item, qIndex){
      const box = document.createElement('div'); box.className = 'question';
      box.innerHTML = '<p style="margin:0 0 10px;font-weight:bold;">' + (qIndex + 1) + '. ' + item.q + '</p>';
      const opts = document.createElement('div'); opts.className = 'options';
      item.opts.forEach(function(opt){
        const label = document.createElement('label'); const input = document.createElement('input');
        input.type = 'radio'; input.name = 'q' + qIndex + '_' + suffix; input.value = opt;
        label.appendChild(input); label.appendChild(document.createTextNode(opt)); opts.appendChild(label);
      });
      box.appendChild(opts); container.appendChild(box);
    });
    
    const checkBtn = document.createElement('button'); checkBtn.className = 'primary'; checkBtn.textContent = 'Corregir respuestas';
    checkBtn.onclick = function(){
      let score = 0; let detalleErrores = []; 
      questions.forEach(function(item, qIndex){
        const labels = container.querySelectorAll('.question')[qIndex].querySelectorAll('label');
        let respuestaUsuario = "No respondida";
        labels.forEach(function(label){
          const input = label.querySelector('input');
          if (input.checked) respuestaUsuario = input.value;
          if (input.checked && input.value === item.a) { label.classList.add('correct'); score++; }
          else if (input.checked) { label.classList.add('wrong'); }
          if (input.value === item.a) label.classList.add('correct');
          input.disabled = true;
        });
        detalleErrores.push({ pregunta: item.q, respuesta_correcta: item.a, tu_respuesta: respuestaUsuario, acertaste: respuestaUsuario === item.a });
      });
      contextoQuiz = detalleErrores;
      const oldScore = container.querySelector('.score'); if (oldScore) oldScore.remove();
      const scoreEl = document.createElement('div'); scoreEl.className = 'score'; scoreEl.textContent = 'Puntuación: ' + score + ' / ' + questions.length;
      container.appendChild(scoreEl);
      
      const tutorBtn = document.createElement('button'); tutorBtn.className = 'primary'; tutorBtn.style.marginTop = '10px'; tutorBtn.style.background = 'var(--violeta)'; tutorBtn.style.width = '100%';
      tutorBtn.textContent = '💬 Pedir al tutor que me explique los errores';
      tutorBtn.onclick = function() {
        document.querySelector('.tab[data-tab="ai"]').click();
        document.getElementById('chatInput').value = "Explícame los errores de mi examen.";
        document.getElementById('chatBtn').click();
      };
      container.appendChild(tutorBtn);
    };
    container.appendChild(checkBtn);
  }

  document.getElementById('aiGenerateBtn').onclick = async function() {
    const topic = document.getElementById('aiTopicInput').value.trim();
    if(!topic) return alert('Escribe un tema para generar el examen');
    
    const loading = document.getElementById('aiLoading'); 
    const container = document.getElementById('quizContainer'); 
    const btn = document.getElementById('aiGenerateBtn');
    
    loading.style.display = 'block'; container.innerHTML = ''; btn.disabled = true;
    
    try {
      const res = await fetch('/api/quiz', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ topic: topic }) });
      const data = await res.json(); 
      if (data.error) throw new Error(data.error);
      renderQuiz(data.questions, container);
    } catch(err) { 
      container.innerHTML = '<p style="color:#b71c1c; text-align:center;">Error: ' + err.message + '</p>'; 
    } finally { 
      loading.style.display = 'none'; btn.disabled = false; 
    }
  };

  // --- FLASHCARDS ---
  function updateFlashcard() {
    if (!currentFlashcards || currentFlashcards.length === 0) return;
    const card = currentFlashcards[currentFcIndex];
    document.getElementById('fcFront').textContent = card.front; 
    document.getElementById('fcBack').textContent = card.back;
    document.getElementById('fcCounter').textContent = (currentFcIndex + 1) + ' / ' + currentFlashcards.length;
    document.getElementById('flashcard').classList.remove('flipped');
  }
  document.getElementById('flashcardBox').onclick = () => { document.getElementById('flashcard').classList.toggle('flipped'); };
  document.getElementById('nextFc').onclick = () => { currentFcIndex = (currentFcIndex + 1) % currentFlashcards.length; updateFlashcard(); };
  document.getElementById('prevFc').onclick = () => { currentFcIndex = (currentFcIndex - 1 + currentFlashcards.length) % currentFlashcards.length; updateFlashcard(); };

  // ================= CHAT IA ESTILO CHATGPT =================
  const chatMessages = document.getElementById('chatMessages');
  const chatInput = document.getElementById('chatInput');
  const chatBtn = document.getElementById('chatBtn');
  const micBtn = document.getElementById('micBtn');

  const iconCopy = `<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>`;
  const iconSpeak = `<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>`;
  const iconRegen = `<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>`;

  function appendMessage(text, sender, isThinking = false) {
    const wrapper = document.createElement('div');
    
    if (sender === 'user') {
      wrapper.className = 'msg-user';
      wrapper.textContent = text;
    } else {
      wrapper.className = 'msg-ai-wrapper';
      
      if (isThinking) {
        wrapper.innerHTML = `<div style="color:#888; font-size:14px; font-style:italic;">Pensando...</div>`;
      } else {
        const txtDiv = document.createElement('div');
        txtDiv.className = 'msg-ai-text';
        txtDiv.textContent = text;
        wrapper.appendChild(txtDiv);

        const actions = document.createElement('div');
        actions.className = 'msg-actions';
        
        const copyBtn = document.createElement('button');
        copyBtn.className = 'action-icon'; copyBtn.innerHTML = iconCopy; copyBtn.title = "Copiar";
        copyBtn.onclick = () => { navigator.clipboard.writeText(text); copyBtn.style.color = 'var(--verde)'; setTimeout(()=>copyBtn.style.color='inherit', 2000); };
        
        const speakBtn = document.createElement('button');
        speakBtn.className = 'action-icon'; speakBtn.innerHTML = iconSpeak; speakBtn.title = "Leer en voz alta";
        speakBtn.onclick = () => {
          if ('speechSynthesis' in window) {
            speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text); u.lang = 'en-GB'; speechSynthesis.speak(u);
          }
        };

        const regenBtn = document.createElement('button');
        regenBtn.className = 'action-icon'; regenBtn.innerHTML = iconRegen; regenBtn.title = "Regenerar";
        regenBtn.onclick = () => { chatInput.value = lastUserMessage; chatBtn.click(); };

        actions.appendChild(copyBtn); actions.appendChild(speakBtn); actions.appendChild(regenBtn);
        wrapper.appendChild(actions);
      }
    }
    chatMessages.appendChild(wrapper);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    return wrapper;
  }

  function loadChatHistory() {
    chatMessages.innerHTML = ''; 
    if (chatHistory.length === 0) {
      appendMessage("¡Hola! Soy tu tutor. Recuerdo todo lo que hablamos. ¿En qué te puedo ayudar hoy?", 'ai');
    } else {
      chatHistory.forEach(msg => appendMessage(msg.content, msg.role === 'user' ? 'user' : 'ai'));
    }
  }

  chatBtn.onclick = async function() {
    const msg = chatInput.value.trim(); 
    if (!msg) return;
    
    lastUserMessage = msg;
    appendMessage(msg, 'user');
    
    // Limpia la caja de texto automáticamente
    chatInput.value = ''; 
    chatInput.focus();
    chatBtn.disabled = true;
    
    chatHistory.push({ role: 'user', content: msg });
    localStorage.setItem('studycast_history', JSON.stringify(chatHistory)); 

    const thinkingDiv = appendMessage('', 'ai', true);
    
    try {
      const res = await fetch('/api/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg, context: contextoQuiz, history: chatHistory.slice(0, -1) })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      
      chatMessages.removeChild(thinkingDiv);
      appendMessage(data.reply, 'ai');
      
      chatHistory.push({ role: 'assistant', content: data.reply });
      localStorage.setItem('studycast_history', JSON.stringify(chatHistory));
      
    } catch (err) { 
      chatMessages.removeChild(thinkingDiv);
      appendMessage('Error: ' + err.message, 'ai'); 
    } finally { 
      chatBtn.disabled = false; 
      chatInput.focus();
    }
  };

  chatInput.addEventListener('keypress', function (e) { if (e.key === 'Enter') chatBtn.click(); });

  document.getElementById('clearChatBtn').onclick = function() {
    if(confirm('¿Borrar conversación?')) {
      chatHistory = [];
      localStorage.removeItem('studycast_history');
      loadChatHistory();
    }
  };

  // Micrófono
  if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.lang = 'es-ES'; recognition.interimResults = false; recognition.maxAlternatives = 1;
    micBtn.onclick = function() { if (isListening) { recognition.stop(); return; } recognition.start(); };
    recognition.onstart = function() { isListening = true; micBtn.classList.add('listening'); chatInput.placeholder = "Escuchando..."; };
    recognition.onresult = function(event) { chatInput.value = event.results[0][0].transcript; };
    recognition.onend = function() { isListening = false; micBtn.classList.remove('listening'); chatInput.placeholder = "Pregúntame cualquier cosa..."; if (chatInput.value.trim() !== "") chatBtn.click(); };
  } else { micBtn.style.display = 'none'; }

  // Iniciar
  selectTopic('present_simple');
  loadChatHistory();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js').catch(()=>{}); });
  }
</script>
</body>
</html>

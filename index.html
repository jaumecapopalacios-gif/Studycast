<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyCast · Tutor IA</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#212121">
<style>
  /* PALETA DE COLORES IDÉNTICA A CHATGPT */
  :root {
    --bg-main: #212121;
    --bg-chat: #212121;
    --bg-user-msg: #2f2f2f;
    --text-main: #ececec;
    --text-muted: #b4b4b4;
    --border-color: #444;
    --input-bg: #2f2f2f;
    --accent: #4db8ff;
  }
  
  * { box-sizing: border-box; }
  body { 
    margin: 0; padding: 0; 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    background: var(--bg-main); 
    color: var(--text-main); 
    height: 100vh; 
    display: flex; 
    flex-direction: column; 
  }
  
  /* HEADER */
  header { 
    padding: 15px 20px; 
    border-bottom: 1px solid var(--border-color); 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
  }
  h1 { margin: 0; font-size: 18px; font-weight: 600; }
  
  /* TABS */
  .tabs { display: flex; justify-content: center; gap: 10px; padding: 10px; background: var(--bg-main); border-bottom: 1px solid var(--border-color); }
  .tab { background: none; border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 14px; }
  .tab.active { background: var(--text-main); color: var(--bg-main); font-weight: bold; }
  .panel { display: none; flex: 1; overflow-y: auto; }
  .panel.active { display: flex; flex-direction: column; }
  
  /* CONTENEDOR DEL CHAT (Estilo ChatGPT) */
  .chat-wrapper { flex: 1; display: flex; flex-direction: column; max-width: 800px; margin: 0 auto; width: 100%; height: 100%; position: relative; }
  
  #chatMessages { 
    flex: 1; 
    overflow-y: auto; 
    padding: 20px; 
    display: flex; 
    flex-direction: column; 
    gap: 24px; 
    padding-bottom: 100px; 
  }
  
  /* MENSAJE DEL USUARIO (Burbuja gris a la derecha) */
  .msg-user { 
    background: var(--bg-user-msg); 
    color: var(--text-main); 
    padding: 12px 20px; 
    border-radius: 24px; 
    align-self: flex-end; 
    max-width: 75%; 
    font-size: 16px; 
    line-height: 1.5;
    word-wrap: break-word;
  }
  
  /* MENSAJE DE LA IA (Texto limpio a la izquierda) */
  .msg-ai-container { align-self: flex-start; width: 100%; max-width: 100%; }
  .msg-ai-text { font-size: 16px; line-height: 1.6; white-space: pre-wrap; margin-bottom: 10px; color: var(--text-main); }
  
  /* Indicador de "Pensando..." */
  .thinking-text { color: var(--text-muted); font-size: 14px; display: flex; align-items: center; gap: 5px; margin-bottom: 5px; }
  
  /* BOTONES DE ACCIÓN DEBAJO DE LA IA */
  .msg-actions { display: flex; gap: 15px; opacity: 0.6; transition: opacity 0.2s; }
  .msg-actions:hover { opacity: 1; }
  .action-icon { 
    background: none; border: none; cursor: pointer; color: var(--text-main); 
    padding: 4px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
  }
  .action-icon svg { width: 18px; height: 18px; fill: currentColor; }
  .action-icon:hover { background: var(--bg-user-msg); }
  
  /* ÁREA DE INPUT (Flotante abajo, estilo ChatGPT) */
  .input-container { 
    position: absolute; 
    bottom: 0; 
    left: 0; 
    right: 0; 
    padding: 20px; 
    background: linear-gradient(180deg, transparent, var(--bg-main) 30%);
  }
  .input-box { 
    display: flex; 
    align-items: center;
    background: var(--input-bg); 
    border-radius: 26px; 
    padding: 10px 15px; 
    border: 1px solid var(--border-color);
    box-shadow: 0 0 15px rgba(0,0,0,0.1);
  }
  .input-box input { 
    flex: 1; 
    background: transparent; 
    border: none; 
    color: var(--text-main); 
    font-size: 16px; 
    padding: 8px 10px; 
    outline: none; 
  }
  .input-box input::placeholder { color: var(--text-muted); }
  
  .send-btn { 
    background: var(--text-main); 
    color: var(--bg-main); 
    border: none; 
    width: 32px; 
    height: 32px; 
    border-radius: 50%; 
    cursor: pointer; 
    display: flex; 
    align-items: center; 
    justify-content: center;
    font-weight: bold;
  }
  .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .mic-btn { 
    background: transparent; 
    border: none; 
    color: var(--text-main); 
    font-size: 18px; 
    cursor: pointer; 
    padding: 0 10px;
  }
  .mic-btn.listening { color: #ff5252; animation: pulse 1s infinite; }
  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
  
  /* ESTILOS PARA EL RESTO DE PESTAÑAS (Podcast y Quiz) */
  .content-pad { padding: 20px; max-width: 800px; margin: 0 auto; width: 100%; }
  .topic-input-box { display: flex; gap: 10px; margin-bottom: 20px; }
  .topic-input-box input { flex: 1; padding: 12px; border: 1px solid var(--border-color); border-radius: 10px; font-size: 16px; background: var(--bg-user-msg); color: var(--text-main); }
  .btn-primary { background: var(--text-main); color: var(--bg-main); border: none; border-radius: 20px; padding: 12px 20px; font-size: 15px; cursor: pointer; font-weight: 600; width: 100%; margin-bottom: 15px;}
  .question { background: var(--bg-user-msg); border-radius: 12px; padding: 16px; margin: 12px 0; border: 1px solid var(--border-color); }
  .options label { display: block; background: var(--bg-main); border: 1px solid var(--border-color); border-radius: 10px; padding: 10px 12px; margin: 6px 0; cursor: pointer; font-size: 15px; color: var(--text-main); }
  .options label.correct { background: #1b5e20; color: white; border-color: #4caf50; }
  .options label.wrong { background: #b71c1c; color: white; border-color: #f44336; }
  .script-line { background: var(--bg-user-msg); border-left: 4px solid var(--accent); border-radius: 10px; padding: 10px 12px; margin: 8px 0; font-size: 14px; }
</style>
</head>
<body>

<header>
  <h1>🎓 StudyCast</h1>
  <span style="font-size: 12px; color: var(--text-muted);">Tutor IA</span>
</header>

<!-- PESTAÑAS -->
<div class="tabs">
  <button class="tab" data-tab="podcast">🎙️ Podcast</button>
  <button class="tab" data-tab="quiz">📝 Examen</button>
  <button class="tab active" data-tab="ai">💬 Chat IA</button>
</div>

<!-- PANEL PODCAST -->
<div class="panel" id="panel-podcast">
  <div class="content-pad">
    <div class="topic-input-box">
      <input type="text" id="globalTopic" placeholder="Escribe un tema (ej: Past Simple)">
    </div>
    <button class="btn-primary" id="generatePodcastBtn">✨ Crear Podcast</button>
    <div id="podcastLoading" style="display:none; text-align:center; margin:20px; color:var(--text-muted);">⏳ Escribiendo guion...</div>
    <div id="scriptContainer"></div>
  </div>
</div>

<!-- PANEL EXAMEN -->
<div class="panel" id="panel-quiz">
  <div class="content-pad">
    <div class="topic-input-box">
      <input type="text" id="quizTopicInput" placeholder="Escribe un tema (ej: Viajes)">
    </div>
    <button class="btn-primary" id="generateQuizBtn">✨ Generar Examen</button>
    <div id="quizLoading" style="display:none; text-align:center; margin:20px; color:var(--text-muted);">⏳ Creando preguntas...</div>
    <div id="quizContainer"></div>
  </div>
</div>

<!-- PANEL CHAT IA (Estilo ChatGPT) -->
<div class="panel active" id="panel-ai">
  <div class="chat-wrapper">
    
    <div id="chatMessages">
      <!-- Los mensajes se inyectan aquí -->
    </div>

    <!-- INPUT FLOTANTE -->
    <div class="input-container">
      <div class="input-box">
        <input type="text" id="chatInput" placeholder="Pregúntame cualquier cosa...">
        <button class="mic-btn" id="micBtn">🎤</button>
        <button class="send-btn" id="chatBtn">↑</button>
      </div>
    </div>

  </div>
</div>

<script>
  let contextoQuiz = null; 
  let isListening = false;
  let chatHistory = JSON.parse(localStorage.getItem('studycast_gpt_history')) || [];
  let lastUserMessage = "";

  // Navegación de pestañas
  document.querySelectorAll('.tab').forEach(function(tab){
    tab.addEventListener('click', function(){
      document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
      document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('active'); });
      tab.classList.add('active'); 
      document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
      
      if(tab.dataset.tab === 'ai') {
        setTimeout(() => document.getElementById('chatInput').focus(), 100);
        const container = document.getElementById('chatMessages');
        container.scrollTop = container.scrollHeight;
      }
    });
  });

  // ================== 1. PODCAST ==================
  document.getElementById('generatePodcastBtn').onclick = async function() {
    const topic = document.getElementById('globalTopic').value.trim();
    if(!topic) return alert('Escribe un tema arriba primero');
    document.getElementById('podcastLoading').style.display = 'block';
    document.getElementById('scriptContainer').innerHTML = '';
    try {
      const res = await fetch('/api/podcast', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ topic: topic }) });
      const data = await res.json(); if (data.error) throw new Error(data.error); renderScript(data.script);
    } catch(err) { alert('Error: ' + err.message); } finally { document.getElementById('podcastLoading').style.display = 'none'; }
  };

  function renderScript(lines) {
    const container = document.getElementById('scriptContainer'); container.innerHTML = '';
    lines.forEach(function(line, i) {
      const div = document.createElement('div'); div.className = 'script-line';
      div.innerHTML = '<span style="color:var(--accent);font-weight:bold;font-size:12px;display:block;">' + line.who + '</span>' + line.text;
      div.onclick = () => playFrom(lines, i); container.appendChild(div);
    });
    const playBtn = document.createElement('button'); playBtn.className = 'btn-primary'; playBtn.textContent = '▶ Escuchar Podcast'; playBtn.onclick = () => playFrom(lines, 0); container.appendChild(playBtn);
  }

  function playFrom(lines, startIndex) {
    if (!('speechSynthesis' in window)) return alert('Tu navegador no soporta voz.');
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    for (let i = startIndex; i < lines.length; i++) {
      const u = new SpeechSynthesisUtterance(lines[i].text); u.lang = 'en-GB';
      if (lines[i].who === 'Host') { u.pitch = 1.1; u.rate = 1.0; } else { u.pitch = 0.9; u.rate = 0.95; }
      speechSynthesis.speak(u);
    }
  }

  // ================== 2. EXAMEN ==================
  document.getElementById('generateQuizBtn').onclick = async function() {
    const topic = document.getElementById('quizTopicInput').value.trim(); if(!topic) return alert('Escribe un tema arriba');
    document.getElementById('quizLoading').style.display = 'block'; document.getElementById('quizContainer').innerHTML = '';
    try {
      const res = await fetch('/api/quiz', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ topic: topic }) });
      const data = await res.json(); if (data.error) throw new Error(data.error); renderQuiz(data.questions);
    } catch(err) { alert('Error: ' + err.message); } finally { document.getElementById('quizLoading').style.display = 'none'; }
  };

  function renderQuiz(questions) {
    const container = document.getElementById('quizContainer'); const suffix = Math.random().toString(36).slice(2);
    questions.forEach(function(item, qIndex){
      const box = document.createElement('div'); box.className = 'question';
      box.innerHTML = '<p style="margin:0 0 10px;font-weight:bold;">' + (qIndex + 1) + '. ' + item.q + '</p>';
      const opts = document.createElement('div'); opts.className = 'options';
      item.opts.forEach(function(opt){
        const label = document.createElement('label'); const input = document.createElement('input');
        input.type = 'radio'; input.name = 'q' + qIndex + '_' + suffix; input.value = opt;
        label.appendChild(input); label.appendChild(document.createTextNode(opt)); opts.appendChild(label);
      });
      box.appendChild(opts); container.appendChild(box);
    });
    
    const checkBtn = document.createElement('button'); checkBtn.className = 'btn-primary'; checkBtn.textContent = 'Corregir respuestas';
    checkBtn.onclick = function(){
      let score = 0; let detalleErrores = []; 
      questions.forEach(function(item, qIndex){
        const labels = container.querySelectorAll('.question')[qIndex].querySelectorAll('label');
        let respuestaUsuario = "No respondida";
        labels.forEach(function(label){
          const input = label.querySelector('input');
          if (input.checked) respuestaUsuario = input.value;
          if (input.checked && input.value === item.a) { label.classList.add('correct'); score++; }
          else if (input.checked) { label.classList.add('wrong'); }
          if (input.value === item.a) label.classList.add('correct');
          input.disabled = true;
        });
        detalleErrores.push({ pregunta: item.q, respuesta_correcta: item.a, tu_respuesta: respuestaUsuario, acertaste: respuestaUsuario === item.a });
      });
      contextoQuiz = detalleErrores;
      const scoreEl = document.createElement('div'); scoreEl.className = 'score'; scoreEl.style.cssText = 'margin-top:20px; padding:15px; background:var(--bg-user-msg); border-radius:10px; text-align:center; font-weight:bold;'; scoreEl.textContent = 'Puntuación: ' + score + ' / ' + questions.length; container.appendChild(scoreEl);
    };
    container.appendChild(checkBtn);
  }

  // ================== 3. CHAT IA (Estilo ChatGPT) ==================
  const chatMessages = document.getElementById('chatMessages');
  const chatInput = document.getElementById('chatInput');
  const chatBtn = document.getElementById('chatBtn');
  const micBtn = document.getElementById('micBtn');

  // SVG Icons para que se vea profesional
  const iconCopy = `<svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>`;
  const iconSpeak = `<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>`;
  const iconRegen = `<svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>`;

  function appendMessage(text, sender, isThinking = false) {
    const wrapper = document.createElement('div');
    
    if (sender === 'user') {
      wrapper.className = 'msg-user';
      wrapper.textContent = text;
    } else {
      wrapper.className = 'msg-ai-container';
      
      if (isThinking) {
        wrapper.innerHTML = `<div class="thinking-text">Pensando...</div>`;
      } else {
        const txtDiv = document.createElement('div');
        txtDiv.className = 'msg-ai-text';
        txtDiv.textContent = text;
        wrapper.appendChild(txtDiv);

        const actions = document.createElement('div');
        actions.className = 'msg-actions';
        
        // Copiar
        const copyBtn = document.createElement('button');
        copyBtn.className = 'action-icon'; copyBtn.innerHTML = iconCopy; copyBtn.title = "Copiar";
        copyBtn.onclick = () => { navigator.clipboard.writeText(text); copyBtn.style.color = '#4caf50'; setTimeout(()=>copyBtn.style.color='inherit', 2000); };
        
        // Escuchar
        const speakBtn = document.createElement('button');
        speakBtn.className = 'action-icon'; speakBtn.innerHTML = iconSpeak; speakBtn.title = "Leer";
        speakBtn.onclick = () => {
          if ('speechSynthesis' in window) {
            speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text); u.lang = 'en-GB'; speechSynthesis.speak(u);
          }
        };

        // Regenerar
        const regenBtn = document.createElement('button');
        regenBtn.className = 'action-icon'; regenBtn.innerHTML = iconRegen; regenBtn.title = "Regenerar";
        regenBtn.onclick = () => { chatInput.value = lastUserMessage; chatBtn.click(); };

        actions.appendChild(copyBtn);
        actions.appendChild(speakBtn);
        actions.appendChild(regenBtn);
        wrapper.appendChild(actions);
      }
    }
    
    chatMessages.appendChild(wrapper);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    return wrapper;
  }

  function loadChatHistory() {
    chatMessages.innerHTML = ''; 
    if (chatHistory.length === 0) {
      appendMessage("¡Hola! Soy StudyCast, tu tutor de inglés. ¿En qué te puedo ayudar hoy?", 'ai');
    } else {
      chatHistory.forEach(msg => appendMessage(msg.content, msg.role === 'user' ? 'user' : 'ai'));
    }
  }

  chatBtn.onclick = async function() {
    const msg = chatInput.value.trim(); 
    if (!msg) return;
    
    lastUserMessage = msg;
    appendMessage(msg, 'user');
    chatInput.value = ''; // Borra el input automáticamente
    chatInput.focus();
    chatBtn.disabled = true;
    
    chatHistory.push({ role: 'user', content: msg });
    localStorage.setItem('studycast_gpt_history', JSON.stringify(chatHistory)); 

    const thinkingDiv = appendMessage('', 'ai', true);
    
    try {
      const res = await fetch('/api/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg, context: contextoQuiz, history: chatHistory.slice(0, -1) })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      
      chatMessages.removeChild(thinkingDiv);
      appendMessage(data.reply, 'ai');
      
      chatHistory.push({ role: 'assistant', content: data.reply });
      localStorage.setItem('studycast_gpt_history', JSON.stringify(chatHistory));
      
    } catch (err) { 
      chatMessages.removeChild(thinkingDiv);
      appendMessage('Error: ' + err.message, 'ai'); 
    } finally { 
      chatBtn.disabled = false; 
      chatInput.focus();
    }
  };

  chatInput.addEventListener('keypress', function (e) { if (e.key === 'Enter') chatBtn.click(); });

  // Micrófono
  if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.lang = 'es-ES'; recognition.interimResults = false; recognition.maxAlternatives = 1;
    micBtn.onclick = function() { if (isListening) { recognition.stop(); return; } recognition.start(); };
    recognition.onstart = function() { isListening = true; micBtn.classList.add('listening'); };
    recognition.onresult = function(event) { chatInput.value = event.results[0][0].transcript; };
    recognition.onend = function() { isListening = false; micBtn.classList.remove('listening'); if (chatInput.value.trim() !== "") chatBtn.click(); };
  } else { micBtn.style.display = 'none'; }

  loadChatHistory();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js').catch(()=>{}); });
  }
</script>
</body>
</html>

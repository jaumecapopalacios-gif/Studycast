<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyCast · Tu App de Estudio</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f4e79">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
<style>
  :root {
    --azul: #1f4e79;
    --violeta: #6a4c93;
    --fondo: #f7f9fb;
    --tarjeta: #ffffff;
    --texto: #222222;
    --borde: #cfd8dc;
    --gris: #f4f6f8;
    --verde: #2e7d32;
    --rojo: #b71c1c;
  }
  
  /* MODO OSCURO */
  body.dark {
    --fondo: #121212;
    --tarjeta: #1e1e1e;
    --texto: #e0e0e0;
    --borde: #333333;
    --gris: #2d2d2d;
    --azul: #4db8ff;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 14px;
    font-family: system-ui, -apple-system, Arial, sans-serif;
    background: var(--fondo);
    color: var(--texto); line-height: 1.5;
    transition: background .3s, color .3s;
  }
  .container {
    max-width: 820px; margin: 0 auto;
    background: var(--tarjeta); border-radius: 16px;
    padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,.08);
  }
  header { text-align: center; margin-bottom: 20px; position: relative; }
  h1 { margin: 0; font-size: 26px; color: var(--azul); }
  .subtitle { color: #888; font-size: 14px; margin: 4px 0 0; }

  .top-btns {
    position: absolute; top: 0; right: 0;
    display: flex; gap: 8px;
  }
  .icon-btn {
    background: var(--gris); border: none; border-radius: 50%;
    width: 36px; height: 36px; cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
  }

  .install-btn {
    display: none; width: 100%; background: var(--verde); color: white;
    border: none; padding: 12px; border-radius: 10px; margin-bottom: 15px;
    font-size: 15px; font-weight: bold; cursor: pointer;
  }

  .topic-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(140px,1fr)); gap: 10px; margin: 16px 0; }
  .topic-btn {
    background: var(--gris); border: 2px solid transparent; color: var(--texto);
    border-radius: 12px; padding: 14px 10px; cursor: pointer; font-size: 14px; font-weight: 600;
    text-align: center; transition: all .2s;
  }
  .topic-btn.active { background: var(--azul); color: #fff; border-color: var(--azul); }
  .topic-btn .emoji { display: block; font-size: 22px; margin-bottom: 4px; }

  .tabs { display: flex; gap: 6px; margin: 18px 0 12px; border-bottom: 2px solid var(--borde); flex-wrap: wrap; }
  .tab {
    background: none; border: none; padding: 10px 14px; cursor: pointer; font-size: 15px; font-weight: 600;
    color: #888; border-bottom: 3px solid transparent; margin-bottom: -2px;
  }
  .tab.active { color: var(--azul); border-bottom-color: var(--azul); }

  .panel { display: none; }
  .panel.active { display: block; animation: fade .3s; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  /* PODCAST */
  .podcast-player { background: linear-gradient(135deg,var(--violeta),var(--azul)); color: #fff; border-radius: 14px; padding: 20px; margin-bottom: 14px; }
  .podcast-controls { display: flex; gap: 8px; flex-wrap: wrap; }
  .podcast-controls button { background: rgba(255,255,255,.2); color: #fff; border: none; border-radius: 10px; padding: 10px 16px; font-size: 15px; cursor: pointer; font-weight: 600; }
  .script-line { background: var(--tarjeta); border-left: 4px solid var(--violeta); border-radius: 10px; padding: 10px 12px; margin: 8px 0; font-size: 14px; cursor: pointer; }
  .script-line.playing { background: rgba(106, 76, 147, 0.2); }

  /* QUIZ */
  .question { background: var(--gris); border-radius: 12px; padding: 16px; margin: 12px 0; }
  .options label { display: block; background: var(--tarjeta); border: 1.5px solid var(--borde); border-radius: 10px; padding: 10px 12px; margin: 6px 0; cursor: pointer; font-size: 15px; color: var(--texto); }
  .options label.correct { background: #e8f5e9; border-color: var(--verde); color: #1b5e20; }
  .options label.wrong { background: #ffebee; border-color: var(--rojo); color: #b71c1c; }
  .score { background: #fff3e0; border: 1.5px solid #ffb74d; border-radius: 12px; padding: 14px; margin-top: 14px; font-weight: bold; text-align: center; color: #e65100; }

  /* FLASHCARDS */
  .flashcard-container { perspective: 1000px; width: 100%; height: 200px; margin: 20px 0; cursor: pointer; }
  .flashcard { width: 100%; height: 100%; position: relative; transition: transform 0.6s; transform-style: preserve-3d; }
  .flashcard.flipped { transform: rotateY(180deg); }
  .flashcard-front, .flashcard-back {
    position: absolute; width: 100%; height: 100%; -webkit-backface-visibility: hidden; backface-visibility: hidden;
    display: flex; align-items: center; justify-content: center; border-radius: 16px; font-size: 24px; font-weight: bold; padding: 20px; text-align: center; box-shadow: 0 4px 12px rgba(0,0,0,.1);
  }
  .flashcard-front { background: var(--azul); color: #fff; }
  .flashcard-back { background: var(--violeta); color: #fff; transform: rotateY(180deg); }

  /* IA */
  .ask-ai { text-align: center; padding: 24px 16px; background: var(--gris); border-radius: 14px; margin-bottom: 12px; }
  .ask-ai input[type="text"] { padding: 10px; border: 1.5px solid var(--borde); border-radius: 10px; width: 100%; max-width: 400px; margin-bottom: 10px; background: var(--tarjeta); color: var(--texto); }
  button.primary { background: var(--azul); color: #fff; border: none; border-radius: 10px; padding: 12px 20px; font-size: 15px; cursor: pointer; font-weight: 600; }
  button.primary:disabled { background: #b0bec5; cursor: not-allowed; }
  #chatReply { margin-top: 12px; text-align: left; background: var(--tarjeta); padding: 12px; border-radius: 10px; border: 1px solid var(--borde); display: none; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="top-btns">
      <button class="icon-btn" id="themeBtn" title="Modo Oscuro">🌙</button>
    </div>
    <h1>🎓 StudyCast</h1>
    <p class="subtitle">Tu App de Estudio para el Examen</p>
  </header>

  <button id="installBtn" class="install-btn">📲 Instalar App en mi dispositivo</button>

  <div class="topic-grid" id="topicGrid"></div>

  <div class="tabs">
    <button class="tab active" data-tab="podcast">🎙️ Podcast</button>
    <button class="tab" data-tab="quiz">📝 Quiz</button>
    <button class="tab" data-tab="flashcards">🃏 Flashcards</button>
    <button class="tab" data-tab="ai">🤖 Tutor IA</button>
  </div>

  <!-- Podcast -->
  <div class="panel active" id="panel-podcast">
    <div class="podcast-player">
      <p id="podcastTitle">Elige un tema arriba</p>
      <div class="podcast-controls">
        <button id="playBtn">▶ Reproducir</button>
        <button id="stopBtn">■ Detener</button>
      </div>
      <div id="nowSpeaking" style="margin-top:12px;font-size:14px;"></div>
    </div>
    <div id="scriptContainer"></div>
  </div>

  <!-- Quiz -->
  <div class="panel" id="panel-quiz">
    <div id="quizContainer"></div>
  </div>

  <!-- Flashcards -->
  <div class="panel" id="panel-flashcards">
    <p style="text-align:center;color:#888;">Haz clic en la tarjeta para girarla.</p>
    <div class="flashcard-container" id="flashcardBox">
      <div class="flashcard" id="flashcard">
        <div class="flashcard-front" id="fcFront">Word</div>
        <div class="flashcard-back" id="fcBack">Translation</div>
      </div>
    </div>
    <div style="display:flex;gap:10px;justify-content:center;">
      <button class="primary" id="prevFc">⬅ Anterior</button>
      <button class="primary" id="nextFc">Siguiente ➡</button>
    </div>
  </div>

  <!-- IA -->
  <div class="panel" id="panel-ai">
    <div class="ask-ai">
      <h3>🤖 Simulacro de Examen</h3>
      <p>Escribe los temas y la IA creará 5 preguntas.</p>
      <input type="text" id="aiTopic" placeholder="Ej: Past Simple, comparativos...">
      <br>
      <button class="primary" id="aiGenerateBtn">Generar preguntas</button>
      <div id="aiLoading" style="display:none;margin-top:12px;">⏳ Generando...</div>
    </div>
    <div id="aiQuizContainer"></div>

    <hr style="margin:24px 0;border:none;border-top:1px solid var(--borde);">

    <div class="ask-ai">
      <h3>💬 Tutor Bilingüe</h3>
      <p>Te explicará en español e inglés.</p>
      <input type="text" id="chatInput" placeholder="Ej: Explícame el past simple...">
      <br>
      <button class="primary" id="chatBtn">Enviar</button>
      <div id="chatReply"></div>
    </div>
  </div>
</div>

<script>
  // --- Lógica de PWA (Instalación) ---
  let deferredPrompt;
  const installBtn = document.getElementById('installBtn');
  
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = 'block';
  });

  installBtn.addEventListener('click', async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') installBtn.style.display = 'none';
      deferredPrompt = null;
    }
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }

  // --- Lógica de Modo Oscuro ---
  const themeBtn = document.getElementById('themeBtn');
  if (localStorage.getItem('theme') === 'dark') {
    document.body.classList.add('dark');
    themeBtn.textContent = '☀️';
  }
  themeBtn.addEventListener('click', () => {
    document.body.classList.toggle('dark');
    const isDark = document.body.classList.contains('dark');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    themeBtn.textContent = isDark ? '☀️' : '🌙';
  });

  // --- DATOS ---
  const TOPICS = {
    present_simple: {
      name: "Present Simple", emoji: "⏰",
      podcast: [
        { who: "Host", text: "Welcome. Today we talk about the present simple." },
        { who: "Teacher", text: "It is for routines. I go to school every day. She works in a hospital." }
      ],
      questions: [
        { q: "My sister ___ to school by bus every day.", a: "goes", opts: ["go","goes","going"] },
        { q: "___ she like pizza?", a: "Does", opts: ["Do","Does","Is"] }
      ],
      flashcards: [
        { front: "go", back: "ir" }, { front: "work", back: "trabajar" }, { front: "every day", back: "todos los días" }
      ]
    },
    past_simple: {
      name: "Past Simple", emoji: "📅",
      podcast: [
        { who: "Host", text: "Today on StudyCast we review the past simple." },
        { who: "Teacher", text: "Actions that finished. Go becomes went. Eat becomes ate." }
      ],
      questions: [
        { q: "I ___ to the park yesterday.", a: "went", opts: ["go","went","going"] },
        { q: "She ___ TV last night.", a: "watched", opts: ["watch","watched","watching"] }
      ],
      flashcards: [
        { front: "went", back: "fui / fue" }, { front: "ate", back: "comí / comió" }, { front: "yesterday", back: "ayer" }
      ]
    },
    vocabulary: {
      name: "Vocabulary", emoji: "📚",
      podcast: [
        { who: "Host", text: "Welcome back. Today we review everyday vocabulary." },
        { who: "Teacher", text: "Let's start with places: bank, supermarket, pharmacy." }
      ],
      questions: [
        { q: "You buy medicine at the ___.", a: "pharmacy", opts: ["bank","pharmacy","library"] },
        { q: "The opposite of 'hot' is ___.", a: "cold", opts: ["warm","cold","big"] }
      ],
      flashcards: [
        { front: "Pharmacy", back: "Farmacia" }, { front: "Bank", back: "Banco" }, { front: "Supermarket", back: "Supermercado" }
      ]
    }
  };

  let currentTopicKey = 'present_simple';
  let currentUtterances = [];
  let currentFcIndex = 0;

  // --- NAVEGACIÓN ---
  const topicGrid = document.getElementById('topicGrid');
  Object.keys(TOPICS).forEach(function(key){
    const t = TOPICS[key];
    const btn = document.createElement('button');
    btn.className = 'topic-btn';
    btn.dataset.key = key;
    btn.innerHTML = '<span class="emoji">' + t.emoji + '</span>' + t.name;
    btn.addEventListener('click', function(){ selectTopic(key); });
    topicGrid.appendChild(btn);
  });

  function selectTopic(key) {
    currentTopicKey = key;
    stopPodcast();
    document.querySelectorAll('.topic-btn').forEach(function(b){
      b.classList.toggle('active', b.dataset.key === key);
    });
    const t = TOPICS[key];
    document.getElementById('podcastTitle').textContent = '🎧 ' + t.name;
    renderScript(t.podcast);
    renderQuiz(t.questions, document.getElementById('quizContainer'));
    renderFlashcards();
    document.getElementById('flashcard').classList.remove('flipped');
    currentFcIndex = 0;
    updateFlashcard();
  }

  document.querySelectorAll('.tab').forEach(function(tab){
    tab.addEventListener('click', function(){
      document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
      document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('active'); });
      tab.classList.add('active');
      document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
    });
  });

  // --- PODCAST ---
  const scriptContainer = document.getElementById('scriptContainer');
  const nowSpeaking = document.getElementById('nowSpeaking');

  function renderScript(lines) {
    scriptContainer.innerHTML = '';
    lines.forEach(function(line, i){
      const div = document.createElement('div');
      div.className = 'script-line';
      div.innerHTML = '<span style="color:var(--violeta);font-weight:bold;font-size:12px;display:block;">' + line.who + '</span>' + line.text;
      div.onclick = () => playFrom(i);
      scriptContainer.appendChild(div);
    });
  }

  function playFrom(startIndex) {
    if (!('speechSynthesis' in window)) return alert('Tu navegador no soporta audio.');
    stopPodcast();
    const lines = TOPICS[currentTopicKey].podcast;
    for (let i = startIndex; i < lines.length; i++) {
      const u = new SpeechSynthesisUtterance(lines[i].text);
      u.lang = 'en-GB';
      if (lines[i].who === 'Host') { u.pitch = 1.1; u.rate = 0.95; }
      else { u.pitch = 0.85; u.rate = 0.9; }
      u.onstart = () => { nowSpeaking.textContent = '▶ ' + lines[i].who + ': ' + lines[i].text; };
      u.onend = () => { if (i === lines.length - 1) nowSpeaking.textContent = '✅ Terminado'; };
      currentUtterances.push(u);
      speechSynthesis.speak(u);
    }
  }

  function stopPodcast() {
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    currentUtterances = [];
    nowSpeaking.textContent = '';
  }
  document.getElementById('playBtn').onclick = () => playFrom(0);
  document.getElementById('stopBtn').onclick = stopPodcast;

  // --- QUIZ ---
  function renderQuiz(questions, container) {
    container.innerHTML = '';
    const suffix = Math.random().toString(36).slice(2);
    questions.forEach(function(item, qIndex){
      const box = document.createElement('div');
      box.className = 'question';
      box.innerHTML = '<p style="margin:0 0 10px;font-weight:bold;">' + (qIndex + 1) + '. ' + item.q + '</p>';
      const opts = document.createElement('div');
      opts.className = 'options';
      item.opts.forEach(function(opt){
        const label = document.createElement('label');
        const input = document.createElement('input');
        input.type = 'radio'; input.name = 'q' + qIndex + '_' + suffix; input.value = opt;
        label.appendChild(input); label.appendChild(document.createTextNode(opt));
        opts.appendChild(label);
      });
      box.appendChild(opts); container.appendChild(box);
    });

    const checkBtn = document.createElement('button');
    checkBtn.className = 'primary'; checkBtn.textContent = 'Corregir respuestas';
    checkBtn.onclick = function(){
      let score = 0;
      questions.forEach(function(item, qIndex){
        const labels = container.querySelectorAll('.question')[qIndex].querySelectorAll('label');
        labels.forEach(function(label){
          const input = label.querySelector('input');
          if (input.checked && input.value === item.a) { label.classList.add('correct'); score++; }
          else if (input.checked) { label.classList.add('wrong'); }
          if (input.value === item.a) label.classList.add('correct');
          input.disabled = true;
        });
      });
      const oldScore = container.querySelector('.score');
      if (oldScore) oldScore.remove();
      const scoreEl = document.createElement('div');
      scoreEl.className = 'score'; scoreEl.textContent = 'Puntuación: ' + score + ' / ' + questions.length;
      container.appendChild(scoreEl);
    };
    container.appendChild(checkBtn);
  }

  // --- FLASHCARDS ---
  function renderFlashcards() {
    const cards = TOPICS[currentTopicKey].flashcards;
    currentFcIndex = 0;
    updateFlashcard();
  }

  function updateFlashcard() {
    const cards = TOPICS[currentTopicKey].flashcards;
    if (!cards || cards.length === 0) return;
    const card = cards[currentFcIndex];
    document.getElementById('fcFront').textContent = card.front;
    document.getElementById('fcBack').textContent = card.back;
    document.getElementById('flashcard').classList.remove('flipped');
  }

  document.getElementById('flashcardBox').onclick = () => {
    document.getElementById('flashcard').classList.toggle('flipped');
  };

  document.getElementById('nextFc').onclick = () => {
    const cards = TOPICS[currentTopicKey].flashcards;
    currentFcIndex = (currentFcIndex + 1) % cards.length;
    updateFlashcard();
  };

  document.getElementById('prevFc').onclick = () => {
    const cards = TOPICS[currentTopicKey].flashcards;
    currentFcIndex = (currentFcIndex - 1 + cards.length) % cards.length;
    updateFlashcard();
  };

  // --- IA ---
  document.getElementById('aiGenerateBtn').onclick = async function(){
    const topic = document.getElementById('aiTopic').value.trim();
    if (!topic) return alert('Escribe un tema');
    const loading = document.getElementById('aiLoading');
    const container = document.getElementById('aiQuizContainer');
    const btn = document.getElementById('aiGenerateBtn');
    loading.style.display = 'block'; container.innerHTML = ''; btn.disabled = true;

    try {
      const res = await fetch('/api/quiz', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ topic: topic })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      renderQuiz(data.questions, container);
    } catch (err) {
      container.innerHTML = '<p style="color:#b71c1c;padding:12px;">Error: ' + err.message + '</p>';
    } finally {
      loading.style.display = 'none'; btn.disabled = false;
    }
  };

  document.getElementById('chatBtn').onclick = async function(){
    const msg = document.getElementById('chatInput').value.trim();
    if (!msg) return;
    const replyBox = document.getElementById('chatReply');
    const btn = document.getElementById('chatBtn');
    replyBox.style.display = 'block'; replyBox.textContent = '⏳ Pensando...'; btn.disabled = true;

    try {
      const res = await fetch('/api/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      replyBox.textContent = data.reply;
    } catch (err) {
      replyBox.textContent = 'Error: ' + err.message;
    } finally {
      btn.disabled = false;
    }
  };

  // Iniciar
  selectTopic('present_simple');
</script>
</body>
</html>
